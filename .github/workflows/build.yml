name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-desktop:
    name: Android + Desktop (tests + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Fails only on findings *newer* than config/detekt/baseline-*.xml, so existing debt does
      # not block the build but new violations cannot slip in.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --console=plain

      # Hand-written version claims in AGENTS.md / CONTRIBUTING.md have now drifted twice. This
      # asserts the prose still agrees with gradle/libs.versions.toml rather than restating it.
      - name: Docs version claims match the catalog
        run: ./.github/scripts/check-doc-versions.sh

      - name: Run core + UI + widget unit tests
        run: |
          ./gradlew \
            :calendar-core:desktopTest \
            :calendar-ui:desktopTest \
            :calendar-widget-data:desktopTest \
            :calendar-widget-glance:testDebugUnitTest \
            --console=plain

      - name: Assemble sample debug APK
        run: ./gradlew :sample-android-app:assembleDebug --console=plain

      # Publishes the four modules to a scratch repo and compiles a throwaway consumer against
      # only those artifacts. This is the only check that can see a dependency-scope mistake: the
      # sample app declares its own Compose/Glance dependencies, so an `implementation` that should
      # have been `api` keeps every in-repo check green while the published POM is unusable.
      - name: Consumer resolution (published POMs are consumable)
        run: ./.github/scripts/check-consumer-resolution.sh

      # calendar-widget-glance is in `apiValidation.ignoredProjects`, so apiCheck registers no dump
      # task for it and no signature change there is visible to any gate. This diffs its public
      # surface against a checked-in, per-declaration list.
      - name: Widget-glance public surface is reviewed
        run: ./.github/scripts/check-widget-glance-surface.sh

  ios:
    name: iOS (compile arm64 + simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # apiCheck runs here rather than in the ubuntu job because the KLib dump spans the iOS
      # targets, and Kotlin/Native can only produce those klibs on a macOS host. Failing on Linux
      # would be a toolchain limitation, not a real API break.
      - name: Check public API compatibility
        run: ./gradlew apiCheck --console=plain

      - name: Compile iOS targets
        run: |
          ./gradlew \
            :calendar-core:compileKotlinIosArm64 \
            :calendar-core:compileKotlinIosSimulatorArm64 \
            :calendar-ui:compileKotlinIosArm64 \
            :calendar-ui:compileKotlinIosSimulatorArm64 \
            :calendar-widget-data:compileKotlinIosArm64 \
            :calendar-widget-data:compileKotlinIosSimulatorArm64 \
            --console=plain

      # `WidgetOptionsJson` is the shared wire format for BOTH platforms — Android on the JVM, iOS
      # through the `WidgetCalendar` K/N framework — and compiling the target only proves the code
      # builds, not that it *behaves* the same. These are `commonTest` cases (WD-08): number width at
      # the Int/Long boundary, Unicode escaping, map keys, and which inputs are rejected at all. A
      # divergence is not a crash but a widget rendering the wrong content forever, because
      # `HijriSharedOptions.swift` re-encodes through this codec on every `loadOptions`.
      - name: Widget-data tests on Kotlin/Native (shared JSON codec)
        run: ./gradlew :calendar-widget-data:iosSimulatorArm64Test --console=plain

      - name: Build iOS app + widget extension (unsigned simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -configuration Debug \
            build